[package]
name = "blob-service-on-rust"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "server"
path = "cmd/server/server.rs"

[[bin]]
name = "client"
path = "cmd/client/client.rs"


[dependencies]
chrono = "0.4"
clap = { version = "4", features = ["derive"] }
mime_guess = "2"
prost = "0.14.4"
prost-types = "0.14.4"
serde = { version = "1", features = ["derive"] }
serde_yaml_ng = "0.10"
sha2 = "0.10"
sqlx = { version = "0.9", default-features = false, features = [
    "runtime-tokio",
    "tls-none",
    "postgres",
    "uuid",
    "chrono",
    "json",
    "derive",
] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tonic = "0.14.9"
tonic-prost = "0.14.9"
uuid = "1"

[build-dependencies]
tonic-prost-build = "0.14.9"
